name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      asset-name: ${{ steps.release.outputs.asset-name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = require('./package.json');
          const version = packageJson.version;
          const tag = process.env.GITHUB_REF_NAME;

          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error(`package.json version must be stable SemVer, got: ${version}`);
          }
          if (tag !== `v${version}`) {
            throw new Error(`Tag ${tag} does not match package version v${version}`);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${version}\nasset=release/vscode-npu-monitor-${version}.vsix\nasset-name=vscode-npu-monitor-${version}.vsix\n`,
          );
          NODE

          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: npm run vsix

      - name: Verify release asset
        env:
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: test -f "$RELEASE_ASSET"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-npu-monitor-vsix
          path: ${{ steps.release.outputs.asset }}
          if-no-files-found: error

  notes:
    name: Generate release notes
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write

    steps:
      - name: Check out release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find previous release tag
        id: previous
        shell: bash
        run: |
          tag="$(git describe --first-parent --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "${GITHUB_REF}^")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes with Copilot
        id: notes
        uses: github/copilot-release-notes@29ba181a86b88f3acee62a03369033edfa982ab9 # v1.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          base-ref: ${{ steps.previous.outputs.tag }}
          head-ref: ${{ github.ref_name }}
          model: ${{ vars.RELEASE_NOTES_MODEL }}

      - name: Save release notes
        env:
          RELEASE_NOTES: ${{ steps.notes.outputs.release-notes }}
          RELEASE_UNCERTAIN: ${{ steps.notes.outputs.uncertain-entries }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        shell: bash
        run: |
          test -n "${RELEASE_NOTES//[[:space:]]/}"
          test "$RELEASE_UNCERTAIN" = '[]'
          mkdir -p release
          printf "## What's Changed\n\n%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n" \
            "$RELEASE_NOTES" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$GITHUB_REF_NAME" > release/RELEASE_NOTES.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-npu-monitor-release-notes
          path: release/RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, notes]
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode-npu-monitor-vsix
          path: release

      - name: Download release notes artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode-npu-monitor-release-notes
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: release/${{ needs.build.outputs.asset-name }}
          RELEASE_NOTES: release/RELEASE_NOTES.md
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          test -s "$RELEASE_ASSET"
          test -s "$RELEASE_NOTES"
          response="$RUNNER_TEMP/release-response"
          if gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$response"; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            if [ "$(awk 'NR == 1 {print $2}' "$response")" != "404" ]; then
              echo "Failed to look up release $RELEASE_TAG; refusing to publish." >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
              --notes-file "$RELEASE_NOTES" \
              --title "$RELEASE_TAG" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
